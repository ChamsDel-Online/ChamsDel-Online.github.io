<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg      { fill: #F5EFE4; }
      .pill    { fill: #9FE3A1; }
      .label   { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #0F1419; }
      .headline{ font-family: 'Fraunces', 'Lora', Georgia, serif; font-weight: 600; font-size: 62px; fill: #0F1419; letter-spacing: -1.2px; }
      .sub     { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 22px; fill: #3F4650; }
      .byline  { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 18px; fill: #3F4650; }
      .bar     { fill: #FF704D; }
      .curve   { stroke: rgba(15,20,25,0.05); stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="630"/>
  <circle class="curve" cx="1300" cy="-50" r="700"/>
  <circle class="curve" cx="-100" cy="750" r="600"/>

  <g transform="translate(80,88)">
    <rect class="pill" x="0" y="0" rx="999" ry="999" width="108" height="36"/>
    <text class="label" x="14" y="23">Products</text>
  </g>

  <text class="headline" x="80" y="275">What I'm building</text>
  <text class="headline" x="80" y="355">right now.</text>
  

  <text class="byline" x="80" y="558">Chaminda Delpagodage. @chams_builds</text>
  <rect class="bar" x="1072" y="553" width="48" height="4" rx="2" ry="2"/>
  <g class="brandmark" transform="translate(1052,128)">
    <text x="0" y="0" font-family="Fraunces, 'Lora', Georgia, serif" font-weight="600" font-size="60" letter-spacing="-2" fill="#0F1419">c</text>
    <circle cx="45" cy="-4" r="8" fill="#FF704D"/>
  </g>
</svg>
